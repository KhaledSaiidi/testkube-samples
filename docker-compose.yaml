services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "4173:8080"
    environment:
      API_UPSTREAM: "http://api:8080"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://api-user:api-password@db:5432/api-db"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16.14-alpine3.23
    restart: always
    environment:
      POSTGRES_DB: api-db
      POSTGRES_USER: api-user
      POSTGRES_PASSWORD: api-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api-user -d api-db"]
      interval: 2s
      retries: 10
      start_period: 1s
      timeout: 10s
