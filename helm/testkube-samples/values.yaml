nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

api:
  replicaCount: 1
  image:
    repository: ghcr.io/khaledsaiidi/testkube-samples-api
    tag: "0.1.3"
    pullPolicy: IfNotPresent
  database:
    secretName: api-db-credentials
    secretKey: uri
  serviceAccount:
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  pdb:
    enabled: false
    maxUnavailable: 1

web:
  replicaCount: 1
  image:
    repository: ghcr.io/khaledsaiidi/testkube-samples-web
    tag: "0.1.3"
    pullPolicy: IfNotPresent
  serviceAccount:
    annotations: {}
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  pdb:
    enabled: false
    maxUnavailable: 1

httpRoute:
  enabled: true
  hostname: testkube.example.com
  gateway:
    name: public-gateway
    namespace: istio-ingress
    httpSectionName: http-wildcard
    httpsSectionName: https-wildcard
