{{- if .Values.api.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "testkube-samples.componentName" (dict "root" . "component" "api") }}
  labels:
    {{- include "testkube-samples.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.api.pdb.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "testkube-samples.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
{{- end }}
