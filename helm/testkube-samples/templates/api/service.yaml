apiVersion: v1
kind: Service
metadata:
  name: {{ include "testkube-samples.componentName" (dict "root" . "component" "api") }}
  labels:
    {{- include "testkube-samples.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
      appProtocol: http
  selector:
    {{- include "testkube-samples.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
