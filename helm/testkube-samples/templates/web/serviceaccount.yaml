apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "testkube-samples.componentName" (dict "root" . "component" "web") }}
  labels:
    {{- include "testkube-samples.labels" (dict "root" . "component" "web") | nindent 4 }}
  {{- with .Values.web.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
